name: Deploy to Firebase Hosting & Functions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run verification and unit tests with coverage
        run: npm test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Build frontend application
        run: npm run build

      - name: Install Cloud Functions dependencies
        run: |
          cd functions
          npm ci

      - name: Deploy to Firebase Hosting & Functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            # Unset expired FIREBASE_TOKEN so firebase-tools uses the service account credentials exclusively
            unset FIREBASE_TOKEN
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-sa-key.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-sa-key.json"
            echo "Authenticating via Google Cloud Service Account (permanent credentials)..."

            # Resolve project ID from secret or auto-extract from service account JSON
            PROJECT_ID="$FIREBASE_PROJECT_ID"
            if [ -z "$PROJECT_ID" ]; then
              PROJECT_ID=$(node -e 'try { console.log(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT).project_id || ""); } catch { console.log(""); }')
            fi

            if [ -n "$PROJECT_ID" ]; then
              echo "Deploying to Firebase project: $PROJECT_ID"
              npx firebase-tools deploy --force --non-interactive --project "$PROJECT_ID"
            else
              npx firebase-tools deploy --force --non-interactive
            fi
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Authenticating via legacy FIREBASE_TOKEN..."
            if [ -n "$FIREBASE_PROJECT_ID" ]; then
              npx firebase-tools deploy --force --non-interactive --token "$FIREBASE_TOKEN" --project "$FIREBASE_PROJECT_ID"
            else
              npx firebase-tools deploy --force --non-interactive --token "$FIREBASE_TOKEN"
            fi
          else
            echo "::error::Authentication secret missing. Add FIREBASE_SERVICE_ACCOUNT (recommended, never expires) in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Clean up temporary Service Account credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa-key.json"
