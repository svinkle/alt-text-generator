name: Deploy to Firebase Hosting & Functions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run verification test suite
        run: npm test

      - name: Build frontend application
        run: npm run build

      - name: Install Cloud Functions dependencies
        run: |
          cd functions
          npm ci

      - name: Deploy to Firebase Hosting & Functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is missing. Please add FIREBASE_TOKEN in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [ -n "$FIREBASE_PROJECT_ID" ]; then
            npx firebase-tools deploy --non-interactive --token "$FIREBASE_TOKEN" --project "$FIREBASE_PROJECT_ID"
          else
            npx firebase-tools deploy --non-interactive --token "$FIREBASE_TOKEN"
          fi
