name: Deploy to Firebase Hosting & Functions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build frontend application
        run: npm run build

      - name: Install Cloud Functions dependencies
        run: |
          cd functions
          npm ci

      - name: Deploy to Firebase Hosting (PR Preview)
        if: github.event_name == 'pull_request' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: '${{ secrets.FIREBASE_PROJECT_ID || "alt-text-generator-app" }}'
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Deploy to Firebase Production (Main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.FIREBASE_TOKEN != ''
        run: |
          npx firebase-tools deploy --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_TOKEN: '${{ secrets.FIREBASE_TOKEN }}'
